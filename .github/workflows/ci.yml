name: ci
on:
  push:
  pull_request:
  schedule:
    # Weekly, against the current stable and nightly toolchains.
    - cron: '17 6 * * 1'
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked --release --all-features
      - run: cargo test --locked --all-features
      - run: cargo test --locked --all-features --examples
      - run: cargo test --locked
  test-32bit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: i686-unknown-linux-gnu
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y gcc-multilib
      - run: cargo test --locked --release --all-features --target i686-unknown-linux-gnu
      - run: cargo test --locked --all-features --target i686-unknown-linux-gnu
      - run: cargo test --locked --all-features --example checkpoint --target i686-unknown-linux-gnu
      - run: cargo test --locked --release --all-features --example checkpoint --target i686-unknown-linux-gnu
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: python3 tests/fixtures/generate_schedule_oracle.py --check
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo doc --locked --no-deps --all-features --document-private-items
        env:
          RUSTDOCFLAGS: -D warnings
      - run: cargo package --locked
  docs-rs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --locked --no-deps --all-features
        env:
          RUSTDOCFLAGS: --cfg docsrs -D warnings
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.89
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked --all-features
      - run: cargo test --locked --all-features --examples
