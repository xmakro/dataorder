[package]
name = "dataorder"
version = "0.3.0"
edition = "2024"
rust-version = "1.89"
description = "Deterministic, seekable dataset ordering: shuffle, mix, repeat and shard without storing an index array"
keywords = ["shuffle", "dataset", "data-loading", "interleave", "permutation"]
categories = ["algorithms", "data-structures"]
repository = "https://github.com/xmakro/dataorder"
license = "MIT OR Apache-2.0"
exclude = ["/.github"]

[dependencies]
serde = { version = "1", features = ["derive"], optional = true }

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["unbounded_depth", "float_roundtrip"] }

# Benchmark subprocess containment only; the library gains no runtime dependency.
[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.61", features = ["Win32_Security", "Win32_System_JobObjects", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Threading"] }

[features]
serde = ["dep:serde"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[[example]]
name = "checkpoint"
required-features = ["serde"]
