[package]
name = "dataorder"
version = "0.4.0"
edition = "2024"
rust-version = "1.89"
description = "Deterministic, seekable dataset ordering: shuffle, mix, repeat and shard without storing an index array"
keywords = ["shuffle", "dataset", "data-loading", "interleave", "permutation"]
categories = ["algorithms", "data-structures"]
repository = "https://github.com/xmakro/dataorder"
license = "MIT OR Apache-2.0"
exclude = ["/.github"]

[dependencies]
serde = { version = "1", features = ["derive"], optional = true }

[dev-dependencies]
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }

[lib]
bench = false

[[bench]]
name = "ordering"
harness = false

[features]
serde = ["dep:serde"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[[example]]
name = "checkpoint"
required-features = ["serde"]
