[package]
name = "dataorder"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Deterministic, seekable data order for training: shuffle, mix with sampling schedules, repeat epochs, slice, stride and concat datasets by length, without materializing anything"
keywords = ["shuffle", "dataset", "data-loading", "interleave", "permutation"]
categories = ["algorithms", "data-structures"]
readme = "README.md"
documentation = "https://docs.rs/dataorder"
license = "MIT OR Apache-2.0"
exclude = ["/.github", "/scripts"]

[dependencies]
serde = { version = "1", features = ["derive"], optional = true }

[dev-dependencies]
serde_json = "1"

[features]
serde = ["dep:serde"]

[package.metadata.docs.rs]
all-features = true

[profile.release]
debug = 1
