[package]
name = "dataorder"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Deterministic, seekable data order for training: shuffle, mix with sampling schedules, repeat epochs, slice, stride and concat datasets by length, without materializing anything"
keywords = ["shuffle", "dataset", "data-loading", "interleave", "permutation"]
categories = ["algorithms", "data-structures"]
repository = "https://github.com/xmakro/dataorder"
license = "MIT OR Apache-2.0"
exclude = ["/.github", "/scripts"]

[dependencies]
serde = { version = "1", features = ["derive"], optional = true }

[dev-dependencies]
serde = "1"
serde_json = { version = "1", features = ["unbounded_depth", "float_roundtrip"] }

[features]
serde = ["dep:serde"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
